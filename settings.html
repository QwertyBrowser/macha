<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Settings</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: system-ui, sans-serif; background: var(--tab-active); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 24px; }
    section { margin-bottom: 24px; }
    .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    select, input[type=text] { width: 100%; height: 36px; border: 1px solid var(--hover); border-radius: 8px; padding: 0 10px; background: var(--input); color: var(--text); font-size: 14px; }
    input[type=color] { width: 60px; height: 36px; border: 0; background: none; padding: 0; cursor: pointer; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: var(--accent); }
    #themes { display: flex; gap: 8px; flex-wrap: wrap; }
    #themes button, #clear { padding: 8px 16px; border: 1px solid var(--hover); border-radius: 8px; background: var(--input); color: var(--text); cursor: pointer; font-size: 14px; }
    #themes button.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    #status { height: 18px; font-size: 13px; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <section>
      <label class="label" for="engine">Search engine</label>
      <select id="engine"></select>
    </section>
    <section>
      <label class="check"><input id="online" type="checkbox"> Show search predictions from my search engine</label>
      <div class="hint">Sends what you type in the address bar to that engine. Off = only your own history and past searches.</div>
    </section>
    <section>
      <label class="label" for="newtab">New tabs open</label>
      <select id="newtab">
        <option value="newtab">QwertyBrowser New Tab page</option>
        <option value="homepage">My homepage</option>
      </select>
    </section>
    <section>
      <label class="label" for="homepage">Homepage (used when "New tabs open" is set to My homepage)</label>
      <input id="homepage" type="text" spellcheck="false">
    </section>
    <section>
      <label class="label" for="taboverflow">When there are many tabs</label>
      <select id="taboverflow">
        <option value="shrink">Shrink tabs to fit, then scroll</option>
        <option value="scroll">Keep tabs full size and scroll</option>
      </select>
    </section>
    <section>
      <span class="label">Theme</span>
      <div id="themes"></div>
    </section>
    <section>
      <label class="label" for="accent">Accent color</label>
      <input id="accent" type="color">
    </section>
    <section>
      <span class="label">Privacy</span>
      <button id="clear">Clear browsing history and past searches</button>
    </section>
    <div id="status"></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
