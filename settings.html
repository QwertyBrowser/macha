<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Settings</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: system-ui, sans-serif; background: var(--tab-active); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 24px; }
    section { margin-bottom: 24px; }
    .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    select, input[type=text] { width: 100%; height: 36px; border: 1px solid var(--hover); border-radius: 8px; padding: 0 10px; background: var(--input); color: var(--text); font-size: 14px; }
    input[type=color] { width: 60px; height: 36px; border: 0; background: none; padding: 0; cursor: pointer; }
    #themes { display: flex; gap: 8px; flex-wrap: wrap; }
    #themes button { padding: 8px 16px; border: 1px solid var(--hover); border-radius: 8px; background: var(--input); color: var(--text); cursor: pointer; }
    #themes button.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    #status { height: 18px; font-size: 13px; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <section>
      <label class="label" for="engine">Search engine</label>
      <select id="engine"></select>
    </section>
    <section>
      <label class="label" for="homepage">Homepage (opens in new tabs)</label>
      <input id="homepage" type="text" spellcheck="false">
    </section>
    <section>
      <span class="label">Theme</span>
      <div id="themes"></div>
    </section>
    <section>
      <label class="label" for="accent">Accent color</label>
      <input id="accent" type="color">
    </section>
    <div id="status"></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
