<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: system-ui, sans-serif; background: var(--tab-active); color: var(--text); }
    h1 { margin: 0; font-size: 44px; letter-spacing: -1px; }
    h1 span { color: var(--accent); }
    form { width: min(560px, 86vw); }
    input { width: 100%; height: 48px; border: 1px solid var(--hover); border-radius: 24px; padding: 0 22px; font-size: 16px; background: var(--input); color: var(--text); outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  </style>
</head>
<body>
  <h1>Qwerty<span>Browser</span></h1>
  <form id="f">
    <input id="q" type="text" placeholder="Search" spellcheck="false" autocomplete="off">
  </form>
  <script src="newtab.js"></script>
</body>
</html>
