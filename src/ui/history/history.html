<!DOCTYPE html>
<html data-theme="mint-light" data-font="nunito">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>History</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: var(--font); background: var(--tab-active); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 20px; }
    h2 { margin: 24px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    #q { width: 100%; height: 40px; border: 1px solid var(--hover); border-radius: 20px; padding: 0 18px; background: var(--input); color: var(--text); font-size: 14px; outline: none; }
    #q:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
    .row:hover { background: var(--hover); }
    .time { flex: 0 0 64px; font-size: 12px; color: var(--muted); }
    .text { flex: 1; min-width: 0; }
    .title { font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .url { font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .actions { opacity: 0; }
    .row:hover .actions, .row:focus-within .actions { opacity: 1; }
    .icon-btn { width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
    .icon-btn:hover { background: var(--input); color: var(--text); }
    #empty { color: var(--muted); padding: 24px 10px; }
    #footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; }
    #note { font-size: 12px; color: var(--muted); }
    .btn { padding: 8px 16px; border: 1px solid var(--hover); border-radius: 8px; background: var(--input); color: var(--text); cursor: pointer; font-size: 14px; }
    #clear.armed { border-color: #e5484d; color: #e5484d; }
  </style>
</head>
<body>
  <main>
    <h1>History</h1>
    <input id="q" type="text" placeholder="Search history" spellcheck="false" autocomplete="off">
    <div id="list"></div>
    <div id="empty" hidden></div>
    <div id="footer">
      <span id="note" hidden>Showing the 500 most recent matches</span>
      <button id="clear" class="btn">Clear history and past searches</button>
    </div>
  </main>
  <script src="history.js"></script>
</body>
</html>
