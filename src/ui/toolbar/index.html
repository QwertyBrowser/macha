<!DOCTYPE html>
<html data-theme="mint-light" data-font="nunito" data-tabs="shrink" data-bar="off" data-find="off">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <title>Macha</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); user-select: none; overflow: hidden; }
    #tabbar { height: 36px; display: flex; align-items: flex-end; padding: 0 8px 0 80px; -webkit-app-region: drag; }
    #tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; overflow-y: hidden; -webkit-app-region: no-drag; }
    #tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 1 200px; min-width: 56px; max-width: 200px; overflow: hidden; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; background: var(--tab); border-radius: 8px 8px 0 0; font-size: 12px; transition: max-width .18s ease, min-width .18s ease, padding .18s ease, margin-right .18s ease, opacity .18s ease, transform .18s ease; }
    .tab.enter, .tab.leaving { min-width: 0; max-width: 0; padding-left: 0; padding-right: 0; margin-right: -2px; opacity: 0; transform: translateX(-14px); }
    .tab.leaving { pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .tab { transition: none; } }    html[data-tabs="scroll"] .tab { flex: 0 0 200px; }
    .tab.active { background: var(--tab-active); box-shadow: inset 0 2px 0 var(--accent); }
    .fav { width: 16px; height: 16px; flex: 0 0 16px; border-radius: 3px; }
    .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .close, #newtab { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
    .close { flex: 0 0 auto; }
    #newtab { flex: 0 0 auto; height: 30px; padding: 0 10px; -webkit-app-region: no-drag; }
    #toolbar { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--tab-active); }
    #toolbar button { width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent; color: var(--text); font-size: 18px; cursor: pointer; }
    #toolbar button:hover:not(:disabled) { background: var(--hover); }
    #toolbar button:disabled { opacity: 0.3; cursor: default; }
    #address { flex: 1; height: 30px; border: 0; border-radius: 15px; padding: 0 14px; background: var(--input); color: var(--text); font-size: 13px; outline: none; user-select: text; }
    #address:focus { box-shadow: 0 0 0 2px var(--accent); }
    #star.on { color: var(--accent); }
    #bookmarkbar { display: none; height: 32px; align-items: center; gap: 4px; padding: 0 8px; background: var(--tab-active); border-top: 1px solid var(--hover); }
    html[data-bar="on"] #bookmarkbar { display: flex; }
    #baritems { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; }
    #baritems::-webkit-scrollbar { display: none; }
    .bm { flex: 0 0 auto; max-width: 180px; height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text); font-size: 12px; cursor: pointer; }
    .bm:hover { background: var(--hover); }
    .bm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .barhint { font-size: 12px; color: var(--muted); padding: 0 8px; }
    #allbookmarks { flex: 0 0 auto; height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
    #allbookmarks:hover { background: var(--hover); color: var(--text); }
    #downloads.active { color: var(--accent); }
    #findbar { display: none; height: 40px; align-items: center; gap: 6px; padding: 0 8px; background: var(--tab-active); border-top: 1px solid var(--hover); }
    html[data-find="on"] #findbar { display: flex; }
    #findinput { width: 240px; height: 28px; border: 0; border-radius: 14px; padding: 0 14px; background: var(--input); color: var(--text); font-size: 13px; outline: none; user-select: text; }
    #findinput:focus { box-shadow: 0 0 0 2px var(--accent); }
    #findcount { min-width: 64px; font-size: 12px; color: var(--muted); }
    #findbar button { width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: var(--text); font-size: 16px; cursor: pointer; }
    #findbar button:hover { background: var(--hover); }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="newtab" title="New tab">+</button>
  </div>
  <div id="toolbar">
    <button id="back" title="Back">‹</button>
    <button id="forward" title="Forward">›</button>
    <button id="reload" title="Reload">⟳</button>
    <input id="address" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
    <button id="star" title="Bookmark this page" disabled>☆</button>
    <button id="downloads" title="Downloads">↓</button>
    <button id="settings" title="Settings">⚙</button>
  </div>
  <div id="bookmarkbar">
    <div id="baritems"></div>
    <button id="allbookmarks">All bookmarks</button>
  </div>
  <div id="findbar">
    <input id="findinput" type="text" placeholder="Find in page" spellcheck="false" autocomplete="off">
    <span id="findcount"></span>
    <button id="findprev" title="Previous match">↑</button>
    <button id="findnext" title="Next match">↓</button>
    <button id="findclose" title="Close">×</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
