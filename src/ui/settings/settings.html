<!DOCTYPE html>
<html data-theme="mint-light" data-font="nunito">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Settings</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: var(--font); background: var(--tab-active); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; --page-accent: var(--accent); }
    h1 { margin: 0 0 24px; }
    section { margin-bottom: 24px; }
    .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    select, input[type=text] { width: 100%; height: 36px; border: 1px solid var(--hover); border-radius: 8px; padding: 0 10px; background: var(--input); color: var(--text); font-size: 14px; }
    input[type=color] { width: 60px; height: 36px; border: 0; background: none; padding: 0; cursor: pointer; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: var(--accent); }
    .btn { padding: 8px 16px; border: 1px solid var(--hover); border-radius: 8px; background: var(--input); color: var(--text); cursor: pointer; font-size: 14px; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    #reset.armed { border-color: #e5484d; color: #e5484d; }
    .accent-row { display: flex; align-items: center; gap: 12px; }
    #themes { display: grid; grid-template-columns: 80px 76px 76px; gap: 10px; align-items: center; }
    .tname { font-size: 14px; }
    .swatch { height: 40px; padding: 0; border: 2px solid var(--hover); border-radius: 10px; cursor: pointer; background: linear-gradient(135deg, var(--bg) 0 58%, var(--accent) 58% 100%); }
    .swatch:hover { transform: translateY(-1px); }
    .swatch.active { outline: 2px solid var(--page-accent); outline-offset: 2px; }
    #status { height: 18px; font-size: 13px; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <section>
      <label class="label" for="engine">Search engine</label>
      <select id="engine"></select>
    </section>
    <section>
      <label class="check"><input id="online" type="checkbox"> Show search predictions from my search engine</label>
      <div class="hint">Sends what you type in the address bar to that engine. Off = only your own history and past searches.</div>
    </section>
    <section>
      <label class="label" for="newtab">New tabs open</label>
      <select id="newtab">
        <option value="newtab">Macha New Tab page</option>
        <option value="homepage">My homepage</option>
      </select>
    </section>
    <section>
      <label class="label" for="homepage">Homepage (used when "New tabs open" is set to My homepage)</label>
      <input id="homepage" type="text" spellcheck="false">
    </section>
    <section>
      <label class="label" for="taboverflow">When there are many tabs</label>
      <select id="taboverflow">
        <option value="shrink">Shrink tabs to fit, then scroll</option>
        <option value="scroll">Keep tabs full size and scroll</option>
      </select>
    </section>
    <section>
      <label class="label" for="lasttab">When I close the last tab</label>
      <select id="lasttab">
        <option value="replace">Replace it with a new tab</option>
        <option value="closeWindow">Close the window</option>
      </select>
    </section>
    <section>
      <label class="label" for="font">Interface font</label>
      <select id="font"></select>
    </section>
    <section>
      <span class="label">Theme</span>
      <div id="themes"></div>
    </section>
    <section>
      <span class="label">Accent color</span>
      <div class="accent-row">
        <input id="accent" type="color">
        <button id="accent-reset" class="btn">Use theme's accent</button>
      </div>
      <div class="hint" id="accent-hint"></div>
    </section>
    <section>
      <span class="label">Privacy</span>
      <button id="clear" class="btn">Clear browsing history and past searches</button>
    </section>
    <section>
      <span class="label">Danger zone</span>
      <button id="reset" class="btn">Reset Macha to factory settings…</button>
      <div class="hint">Restores every setting to its default and clears history, like a first launch. Once the setup wizard exists, this will reopen it too.</div>
    </section>
    <div id="status"></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
