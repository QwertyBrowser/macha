<!DOCTYPE html>
<html data-theme="mint-light" data-font="nunito">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Downloads</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: var(--font); background: var(--tab-active); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 20px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; }
    .row:hover { background: var(--hover); }
    .text { flex: 1; min-width: 0; }
    .name { font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sub { font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .bar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--input); overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); }
    .actions { display: flex; gap: 4px; flex: 0 0 auto; }
    .small { padding: 4px 10px; border: 1px solid var(--hover); border-radius: 8px; background: var(--input); color: var(--text); cursor: pointer; font-size: 12px; }
    .small:hover { border-color: var(--accent); }
    #empty { color: var(--muted); padding: 24px 10px; }
    #footer { margin-top: 28px; text-align: right; }
    .btn { padding: 8px 16px; border: 1px solid var(--hover); border-radius: 8px; background: var(--input); color: var(--text); cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Downloads</h1>
    <div id="list"></div>
    <div id="empty" hidden>No downloads yet.</div>
    <div id="footer"><button id="clear" class="btn" hidden>Clear finished downloads</button></div>
  </main>
  <script src="downloads.js"></script>
</body>
</html>
